      - Purchasing
      - Permits to Work
      - Asset Lockout
      - API Access
      - Fire Risk Assessments
      - "Risk Assessments *coming soon"

all_plans_include:
  - Work Orders
  - PM Scheduling
  - Asset Management
  - Mobile Apps

plans:
  - name: Basic
    price: 15
    currency: £
    period: per user/month
    description: Ideal for small maintenance teams getting started with CMMS.
    differentiators: []

  - name: Standard
    price: 21
    currency: £
    period: per user/month
    description: For growing businesses requiring procedures and contractor management.
    differentiators:
      - Procedures
      - Subcontractors
      - Failure Codes
      - Asset Labels
      - Spare Part Labels
      - Technician Leave

  - name: Advanced
    price: 27
    currency: £
    period: per user/month
    description: Complete maintenance management with purchasing, condition monitoring and analytics.
    differentiators:
      - Check Lists
      - Condition Monitoring
      - Statistics
      - Purchasing
      - Permits to Work
      - Asset Lockout
      - API Access
      - Fire Risk Assessments
      - "Risk Assessments *coming soon"

all_plans_include:
  - Works order management
  - Preventative maintenance scheduling
  - Dashboard
  - Email reminders
  - Asset management & hierarchy
  - Multi-site Deployment
  - Spare parts
  - Excel reporting
  - Mobile Apps

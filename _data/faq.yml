- question: How do I access Smartspanner CMMS?
  answer: Smartspanner is a cloud-hosted application accessed through a current modern browser, including Microsoft Edge. Internet Explorer is not supported. Native iOS and Android apps are also available and require an internet connection. Initial signup and account setup are completed in a web browser.

- question: Will Smartspanner work for my company?
  answer: Smartspanner supports small maintenance teams and multi-site organisations. Teams can begin with assets, work orders and preventive maintenance, then add procedures, inspections, inventory, purchasing, permits, reporting and other operational controls as required.

- question: Is my data secure?
  answer: Connections to Smartspanner are protected using HTTPS. Customers should also protect account credentials and follow their own access-control policies. Further information is available in the Smartspanner Privacy Policy and Terms of Service.

- question: If I cancel my subscription, what happens to the data?
  answer: Customers can end a subscription by giving the notice set out in the Terms of Service. In-app CSV and PDF exports remain available for 30 days following termination or expiry, except where Smartspanner terminates for cause. Stored data may be deleted after that period unless retention is required by law or the Privacy Policy.

- question: What payment methods are available?
  answer: We accept credit cards for subscription payments. Account billing without a credit card can also be arranged in GBP, EUR, USD, NZD or AUD. Fees are billed in advance for the monthly or annual billing cycle and exclude applicable taxes. Please contact us for details.

- question: Where can I get an invoice?
  answer: Invoices are emailed automatically at every billing cycle.

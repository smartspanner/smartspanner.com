<section id="testimonials" class="testimonials section-bg">
  <div class="container">
    <div class="section-header">
      <h2>Testimonials</h2>
    </div>
    
    <div class="row" style="margin: 0 -8px;">
      {% for testimonial in site.data.testimonials %}
      <div class="col-lg-4 col-md-6" style="padding: 0 8px;">
        <div class="testimonial-item">
          <h3>{{ testimonial.name }}</h3>
          <h4>{{ testimonial.role }}</h4>
          <div class="stars">
            {% for i in (1..testimonial.stars) %}
            <i class="fa-solid fa-star"></i>
            {% endfor %}
          </div>
          <p>
            <i class="fa-solid fa-quote-left quote-icon-left"></i>
            {{ testimonial.quote }}
            <i class="fa-solid fa-quote-right quote-icon-right"></i>
          </p>
        </div>
      </div>
      {% endfor %}
    </div>

    <div class="text-center" style="margin-top: 30px;">
      <a href="{{ '/book-a-demo' | relative_url }}" class="btn btn-primary" style="margin: 10px; padding: 12px 40px; border-radius: 50px; font-size: 16px;">Book a Demo</a>
      <a href="{{ site.signup_url }}" class="btn btn-secondary" style="margin: 10px; padding: 12px 40px; border-radius: 50px; font-size: 16px;">Start Free Trial</a>
    </div>
  </div>
</section>

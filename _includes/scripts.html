<script>
  // Mobile Navigation Toggle
  const navShow = document.querySelector('.mobile-nav-show');
  const navHide = document.querySelector('.mobile-nav-hide');
  const navbar = document.querySelector('#navbar');
  const header = document.getElementById('header');

  function setMobileNav(isOpen) {
    document.body.classList.toggle('mobile-nav-active', isOpen);
    if (navbar) navbar.classList.toggle('active', isOpen);
    if (navShow) navShow.setAttribute('aria-expanded', String(isOpen));
  }

  if (navShow) {
    navShow.addEventListener('click', function() {
      setMobileNav(true);
    });
  }

  if (navHide) {
    navHide.addEventListener('click', function() {
      setMobileNav(false);
    });
  }

  // Dropdown toggle for mobile
  document.querySelectorAll('.navbar .dropdown > a').forEach(function(el) {
    el.addEventListener('click', function(e) {
      if (window.innerWidth < 1280) {
        e.preventDefault();
        this.parentElement.classList.toggle('active');
      }
    });
  });
  
  // Scroll to top
  const scrollTop = document.getElementById('scroll-top');
  
  let scrollTicking = false;
  window.addEventListener('scroll', function() {
    if (!scrollTicking) {
      requestAnimationFrame(function() {
        if (window.scrollY > 100) {
          scrollTop.classList.add('active');
          if (header) header.classList.add('scrolled');
        } else {
          scrollTop.classList.remove('active');
          if (header) header.classList.remove('scrolled');
        }
        scrollTicking = false;
      });
      scrollTicking = true;
    }
  });
  
  scrollTop.addEventListener('click', function() {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
</script>

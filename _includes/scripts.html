<script>
  // Mobile Navigation Toggle
  const mobileNavShow = document.querySelector('.mobile-nav-show');
  const mobileNavHide = document.querySelector('.mobile-nav-hide');
  const navbar = document.querySelector('#navbar');

  if (mobileNavShow && mobileNavHide && navbar) {
    mobileNavShow.addEventListener('click', function() {
      document.body.classList.add('mobile-nav-active');
      navbar.classList.add('active');
    });

    mobileNavHide.addEventListener('click', function() {
      document.body.classList.remove('mobile-nav-active');
      navbar.classList.remove('active');
    });
  }
  
  // Dropdown toggle for mobile
  document.querySelectorAll('.navbar .dropdown > a').forEach(function(el) {
    el.addEventListener('click', function(e) {
      if (window.innerWidth < 1280) {
        e.preventDefault();
        this.parentElement.classList.toggle('active');
      }
    });
  });
  
  // Scroll to top
  const scrollTop = document.getElementById('scroll-top');
  const header = document.getElementById('header');
  
  let scrollTicking = false;
  window.addEventListener('scroll', function() {
    if (!scrollTicking) {
      requestAnimationFrame(function() {
        if (scrollTop) {
          scrollTop.classList.toggle('active', window.scrollY > 100);
        }

        if (header) {
          header.classList.toggle('scrolled', window.scrollY > 100);
        }

        scrollTicking = false;
      });
      scrollTicking = true;
    }
  });
  
  if (scrollTop) {
    scrollTop.addEventListener('click', function() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  }

  // Hero introduction video modal
  (function() {
    const videoTrigger = document.querySelector('.hero-video-trigger');
    const videoModal = document.querySelector('.hero-video-modal');

    if (!videoTrigger || !videoModal) {
      return;
    }

    const iframe = videoModal.querySelector('iframe');
    const closeButton = videoModal.querySelector('.hero-video-modal-close');
    let lastFocusedElement = null;

    function openVideoModal() {
      lastFocusedElement = document.activeElement;
      iframe.src = videoTrigger.dataset.videoSrc;
      videoModal.classList.add('active');
      videoModal.setAttribute('aria-hidden', 'false');
      document.body.classList.add('hero-video-modal-open');
      closeButton.focus();
    }

    function closeVideoModal() {
      videoModal.classList.remove('active');
      videoModal.setAttribute('aria-hidden', 'true');
      document.body.classList.remove('hero-video-modal-open');
      iframe.removeAttribute('src');

      if (lastFocusedElement) {
        lastFocusedElement.focus();
      }
    }

    videoTrigger.addEventListener('click', openVideoModal);
    closeButton.addEventListener('click', closeVideoModal);
    videoModal.addEventListener('click', function(event) {
      if (event.target === videoModal) {
        closeVideoModal();
      }
    });
    document.addEventListener('keydown', function(event) {
      if (event.key === 'Escape' && videoModal.classList.contains('active')) {
        closeVideoModal();
      }
    });
  })();

  // Click-to-expand product screenshots
  (function() {
    const imageModal = document.createElement('div');
    imageModal.className = 'screenshot-lightbox';
    imageModal.setAttribute('aria-hidden', 'true');
    imageModal.innerHTML = '<button class="screenshot-lightbox-close" type="button" aria-label="Close image view">&times;</button><img src="" alt="">';
    document.body.appendChild(imageModal);

    const modalImage = imageModal.querySelector('img');
    const closeButton = imageModal.querySelector('button');

    function resolveFullSizeScreenshot(src) {
      let url;

      try {
        url = new URL(src, window.location.href);
      } catch (error) {
        return src;
      }

      const featureMatch = url.pathname.match(/^(.*\/assets\/img\/features\/)([^/]+)-thumb\.webp$/);
      if (featureMatch) {
        url.pathname = featureMatch[1] + featureMatch[2] + (featureMatch[2] === 'purchasing' ? '.jpg' : '.png');
        url.search = '';
        url.hash = '';
        return url.href;
      }

      const laptopMatch = url.pathname.match(/^(.*\/assets\/img\/)laptop-thumb\.webp$/);
      if (laptopMatch) {
        url.pathname = laptopMatch[1] + 'laptop.png';
        url.search = '';
        url.hash = '';
        return url.href;
      }

      return src;
    }

    function openLightbox(src, alt) {
      modalImage.src = resolveFullSizeScreenshot(src);
      modalImage.alt = alt || 'Smartspanner screenshot';
      imageModal.classList.add('active');
      imageModal.setAttribute('aria-hidden', 'false');
      document.body.classList.add('screenshot-lightbox-open');
    }

    function closeLightbox() {
      imageModal.classList.remove('active');
      imageModal.setAttribute('aria-hidden', 'true');
      document.body.classList.remove('screenshot-lightbox-open');
      modalImage.removeAttribute('src');
    }

    document.querySelectorAll('main img[src*="/assets/img/"], .hero-split-img').forEach(function(img) {
      if (img.closest('a') || img.classList.contains('no-lightbox')) {
        return;
      }

      img.classList.add('screenshot-expandable');
      img.addEventListener('click', function() {
        openLightbox(img.currentSrc || img.src, img.alt);
      });
    });

    document.querySelectorAll('.img-bg').forEach(function(panel) {
      if (panel.classList.contains('no-lightbox')) {
        return;
      }

      const backgroundImage = window.getComputedStyle(panel).backgroundImage;
      const match = backgroundImage.match(/url\(["']?(.*?)["']?\)/);

      if (!match || !match[1] || match[1].indexOf('/assets/img/') === -1) {
        return;
      }

      panel.classList.add('screenshot-expandable');
      panel.setAttribute('role', 'button');
      panel.setAttribute('tabindex', '0');
      panel.setAttribute('aria-label', 'View screenshot');

      function activatePanel() {
        openLightbox(match[1], panel.getAttribute('aria-label'));
      }

      panel.addEventListener('click', activatePanel);
      panel.addEventListener('keydown', function(event) {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          activatePanel();
        }
      });
    });

    closeButton.addEventListener('click', closeLightbox);
    imageModal.addEventListener('click', function(event) {
      if (event.target === imageModal) {
        closeLightbox();
      }
    });
    document.addEventListener('keydown', function(event) {
      if (event.key === 'Escape' && imageModal.classList.contains('active')) {
        closeLightbox();
      }
    });
  })();

  // GA4 measurement for the customer-story to demo funnel.
  (function() {
    const originStorageKey = 'smartspanner_case_study_origin';
    const submissionStorageKey = 'smartspanner_demo_submission';
    const attributionWindowMs = 30 * 60 * 1000;

    function trackEvent(eventName, parameters) {
      if (typeof window.gtag !== 'function') {
        return;
      }

      window.gtag('event', eventName, Object.assign({
        transport_type: 'beacon'
      }, parameters || {}));
    }

    function writeSessionValue(key, value) {
      try {
        window.sessionStorage.setItem(key, JSON.stringify(value));
      } catch (error) {
        // Measurement must never interrupt navigation or form submission.
      }
    }

    function readSessionValue(key, removeAfterReading) {
      try {
        const rawValue = window.sessionStorage.getItem(key);

        if (!rawValue) {
          return null;
        }

        if (removeAfterReading) {
          window.sessionStorage.removeItem(key);
        }

        return JSON.parse(rawValue);
      } catch (error) {
        return null;
      }
    }

    function getCaseStudyOrigin() {
      const origin = readSessionValue(originStorageKey, false);

      if (!origin || !origin.timestamp || Date.now() - origin.timestamp > attributionWindowMs) {
        return null;
      }

      return origin;
    }

    function addOriginParameters(parameters) {
      const origin = getCaseStudyOrigin();

      if (!origin) {
        return parameters;
      }

      return Object.assign(parameters, {
        entry_content: origin.caseStudy,
        entry_industry: origin.industry
      });
    }

    window.smartspannerAnalytics = {
      recordSuccessfulDemoSubmission: function() {
        writeSessionValue(submissionStorageKey, {
          timestamp: Date.now(),
          origin: getCaseStudyOrigin()
        });
      }
    };

    const caseStudyPage = document.querySelector('.case-study-page[data-case-study]');

    if (caseStudyPage) {
      const caseStudy = caseStudyPage.dataset.caseStudy;
      const industry = caseStudyPage.dataset.caseStudyIndustry;
      let engagementRecorded = false;
      let activeSeconds = 0;
      let activeTimer;

      function recordEngagement(method) {
        if (engagementRecorded) {
          return;
        }

        engagementRecorded = true;
        window.clearInterval(activeTimer);
        window.removeEventListener('scroll', checkScrollDepth);
        trackEvent('case_study_engaged', {
          case_study: caseStudy,
          industry: industry,
          engagement_method: method
        });
      }

      function checkScrollDepth() {
        const pageTop = window.scrollY + caseStudyPage.getBoundingClientRect().top;
        const viewedDistance = window.scrollY + window.innerHeight - pageTop;
        const progress = viewedDistance / caseStudyPage.offsetHeight;

        if (progress >= 0.5) {
          recordEngagement('scroll_50_percent');
        }
      }

      activeTimer = window.setInterval(function() {
        if (document.visibilityState === 'visible') {
          activeSeconds += 1;
        }

        if (activeSeconds >= 45) {
          recordEngagement('active_45_seconds');
        }
      }, 1000);

      window.addEventListener('scroll', checkScrollDepth, { passive: true });
      checkScrollDepth();

      caseStudyPage.querySelectorAll('[data-ga-event="case_study_cta_click"]').forEach(function(link) {
        link.addEventListener('click', function() {
          writeSessionValue(originStorageKey, {
            caseStudy: caseStudy,
            industry: industry,
            timestamp: Date.now()
          });

          trackEvent('case_study_cta_click', {
            case_study: caseStudy,
            industry: industry,
            cta_location: link.dataset.gaCtaLocation || 'unknown',
            link_url: link.href
          });
        });
      });
    }

    const demoForm = document.querySelector('.js-hubspot-demo-form');

    if (demoForm) {
      let formViewRecorded = false;

      function recordFormView() {
        if (formViewRecorded) {
          return;
        }

        formViewRecorded = true;
        trackEvent('view_demo_form', addOriginParameters({
          form_id: 'demo_request'
        }));
      }

      if ('IntersectionObserver' in window) {
        const formObserver = new IntersectionObserver(function(entries) {
          if (entries.some(function(entry) { return entry.isIntersecting; })) {
            recordFormView();
            formObserver.disconnect();
          }
        }, { threshold: 0.25 });

        formObserver.observe(demoForm);
      } else {
        recordFormView();
      }
    }

    if (document.querySelector('[data-ga-page="demo-thank-you"]')) {
      const successfulSubmission = readSessionValue(submissionStorageKey, true);

      if (successfulSubmission && successfulSubmission.timestamp && Date.now() - successfulSubmission.timestamp <= attributionWindowMs) {
        const leadParameters = {
          form_id: 'demo_request'
        };

        if (successfulSubmission.origin) {
          leadParameters.entry_content = successfulSubmission.origin.caseStudy;
          leadParameters.entry_industry = successfulSubmission.origin.industry;
        }

        trackEvent('generate_lead', leadParameters);
      }
    }
  })();

  // HubSpot forms. Keeps local styling while submitting to HubSpot's Forms API.
  (function() {
    const hubspotForms = document.querySelectorAll('.js-hubspot-lead-form, .js-hubspot-demo-form');

    if (!hubspotForms.length) {
      return;
    }

    function getCookie(name) {
      const match = document.cookie.match(new RegExp('(^|; )' + name + '=([^;]*)'));
      return match ? decodeURIComponent(match[2]) : '';
    }

    function getValue(form, names) {
      for (const name of names) {
        const field = form.querySelector('[name="' + name + '"]');
        if (field && field.value.trim()) {
          return field.value.trim();
        }
      }

      return '';
    }

    function getCheckedValues(form, name) {
      return Array.from(form.querySelectorAll('[name="' + name + '"]:checked'))
        .map(function(field) {
          return field.value.trim();
        })
        .filter(Boolean)
        .join(';');
    }

    function buildLeadFields(form) {
      return [
        { name: 'firstname', value: getValue(form, ['FirstName', 'Name']) },
        { name: 'email', value: getValue(form, ['WorkEmail', 'Email']) },
        { name: 'lead_gen_name', value: form.dataset.leadGenName || '' }
      ].filter(function(field) {
        return field.value;
      });
    }

    function buildDemoFields(form) {
      return [
        { name: 'firstname', value: getValue(form, ['FirstName']) },
        { name: 'lastname', value: getValue(form, ['LastName']) },
        { name: 'email', value: getValue(form, ['Email']) },
        { name: 'phone', value: getValue(form, ['Telephone']) },
        { name: 'preferred_contact_method', value: getCheckedValues(form, 'PreferredContactMethod') },
        { name: 'expected_number_of_users', value: getValue(form, ['ExpectedUsers']) },
        { name: 'demo_reason', value: getCheckedValues(form, 'DemoReason') },
        { name: 'demo_reason_other', value: getValue(form, ['DemoReasonOther']) },
        { name: 'message', value: getValue(form, ['Message']) }
      ].filter(function(field) {
        return field.value;
      });
    }

    function buildFields(form) {
      if (form.classList.contains('js-hubspot-demo-form')) {
        return buildDemoFields(form);
      }

      return buildLeadFields(form);
    }

    function showError(form) {
      let error = form.querySelector('.hubspot-form-error');

      if (!error) {
        error = document.createElement('p');
        error.className = 'hubspot-form-error';
        error.style.color = '#b42318';
        error.style.fontSize = '13px';
        error.style.marginTop = '12px';
        error.textContent = 'Sorry, something went wrong. Please try again or email sales@smartspanner.com.';
        form.appendChild(error);
      }

      error.hidden = false;
    }

    function hideError(form) {
      const error = form.querySelector('.hubspot-form-error');

      if (error) {
        error.hidden = true;
      }
    }

    hubspotForms.forEach(function(form) {
      form.addEventListener('submit', function(event) {
        event.preventDefault();
        hideError(form);

        if (!form.checkValidity()) {
          form.reportValidity();
          return;
        }

        const portalId = form.dataset.hubspotPortalId;
        const formId = form.dataset.hubspotFormId;
        const region = form.dataset.hubspotRegion || 'na1';
        const redirectUrl = form.dataset.hubspotRedirect;
        const submitButton = form.querySelector('[type="submit"]');
        const originalButtonText = submitButton ? submitButton.textContent : '';
        const hutk = getCookie('hubspotutk');
        const payload = {
          fields: buildFields(form),
          context: {
            pageUri: window.location.href,
            pageName: document.title
          }
        };

        if (hutk) {
          payload.context.hutk = hutk;
        }

        if (submitButton) {
          submitButton.disabled = true;
          submitButton.textContent = 'Submitting...';
        }

        fetch('https://api.hsforms.com/submissions/v3/integration/submit/' + portalId + '/' + formId, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        })
          .then(function(response) {
            if (!response.ok) {
              throw new Error('HubSpot form submission failed');
            }

            if (window.smartspannerAnalytics) {
              window.smartspannerAnalytics.recordSuccessfulDemoSubmission();
            }

            window.location.href = redirectUrl;
          })
          .catch(function() {
            if (submitButton) {
              submitButton.disabled = false;
              submitButton.textContent = originalButtonText;
            }

            showError(form);
          });
      });
    });
  })();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
  {% include head.html %}
</head>
<body>
  <!-- Main-site header shell, logo only for focused landing pages -->
  <header id="header" class="header landing-header d-flex align-items-center">
    <div class="container-fluid d-flex align-items-center justify-content-between">
      <a href="{{ '/' | relative_url }}" class="logo">
        <img src="{{ '/assets/img/logo.png' | relative_url }}" alt="Smartspanner">
      </a>
    </div>
  </header>

  {{ content }}

  <!-- Slim footer -->
  <footer class="lp-footer">
    <div class="container">
      &copy; {{ site.time | date: '%Y' }} {{ site.company.name }}. All Rights Reserved.
      <p><a href="{{ '/privacy-policy/' | relative_url }}">Privacy</a> · <a href="{{ '/cookie-policy/' | relative_url }}">Cookies</a> · <a href="{{ '/terms-of-service/' | relative_url }}">Terms</a> · <button type="button" class="cookie-settings-button" data-cookie-action="settings">Cookie settings</button></p>
    </div>
  </footer>

  <div class="scroll-top" id="scroll-top">
    <i class="fa-solid fa-arrow-up"></i>
  </div>

  {% include cookie-consent.html %}
  {% include scripts.html %}
</body>
</html>

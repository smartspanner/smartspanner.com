<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.meta_title | escape }}</title>
  <meta name="description" content="{{ page.description | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="alternate" type="text/plain" href="{{ '/llms.txt' | absolute_url }}" title="LLMs.txt">
  <link rel="alternate" type="text/plain" href="{{ '/llms-full.txt' | absolute_url }}" title="LLMs Full Context">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ site.title | escape }}">
  <meta property="og:locale" content="en_GB">
  <meta property="og:title" content="{{ page.meta_title | escape }}">
  <meta property="og:description" content="{{ page.description | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ page.image | absolute_url }}">
  <meta property="og:image:alt" content="Smartspanner maintenance dashboard">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ page.meta_title | escape }}">
  <meta name="twitter:description" content="{{ page.description | escape }}">
  <meta name="twitter:image" content="{{ page.image | absolute_url }}">
  <meta name="twitter:image:alt" content="Smartspanner maintenance dashboard">
  {% include assessment-structured-data.html %}
  <link rel="icon" href="{{ site.baseurl }}/assets/img/icon.png">
  {% assign assessment_asset_version = site.time | date: '%s' %}
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/maintenance-assessment.css?v={{ assessment_asset_version }}">
  <noscript><style>#ma-load-status{display:none}</style></noscript>
</head>
<body>
  <a class="ma-skip" href="#main">Skip to assessment</a>
  <header class="ma-header">
    <a href="{{ '/' | relative_url }}" aria-label="Smartspanner home"><img src="{{ site.baseurl }}/assets/img/logo.png" alt="Smartspanner" width="176"></a>
    <span class="ma-header-label">THE MAINTENANCE ASSESSMENT</span>
    <a class="ma-exit" href="{{ '/' | relative_url }}">Back to Smartspanner <span aria-hidden="true">↗</span></a>
  </header>
  {{ content }}
  <footer class="ma-footer"><span>Made by Smartspanner · A practical next step for maintenance teams</span><a href="{{ '/privacy-policy/' | relative_url }}">Privacy</a></footer>
  <script src="{{ site.baseurl }}/assets/js/maintenance-assessment-model.js?v={{ assessment_asset_version }}" defer></script>
  <script src="{{ site.baseurl }}/assets/js/maintenance-assessment.js?v={{ assessment_asset_version }}" defer></script>
  <script src="{{ site.baseurl }}/assets/js/maintenance-assessment-print.js?v={{ assessment_asset_version }}" defer></script>
</body>
</html>
